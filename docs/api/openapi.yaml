  /sync/push:
    post:
      tags:
      - Sinkronisasi
      operationId: post_sync_push
      summary: Kirim antrian offline (maks. 100 entitas / 1.000 baris pesanan per batch; saat online disarankan ≤ 8 transaksi
        per permintaan)
      description: 'Diproses berurutan; setiap entitas dalam transaksi sendiri dan idempoten berdasarkan (type, id). ID sama
        dengan isi berbeda → `CONFLICT`. Header opsional `X-Device-Time` untuk menghitung selisih jam. Payload per jenis:
        `shift.open` {cashier_id, opening_cash, opened_at}; `cash_movement` {shift_id, type in|out|drawer_open, amount, reason,
        created_by, created_at, authorization?}; `kitchen.send` = KitchenTicketInput; `order` = OrderInput; `order.void` {order_id,
        voided_by, reason, created_at, authorization?, stock_action? return|waste}; `order.refund` {order_id, shift_id, amount,
        method, stock_action, reason, refunded_by, created_at, lines?, authorization?}; `shift.close` {shift_id, closed_by,
        closed_at, counted_cash, denominations?, variance_note?}.'
      parameters:
      - name: X-Device-Time
        in: header
        required: false
        schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - batch_id
              - entities
              properties:
                batch_id: *id002
                entities:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - type
                    - id
                    - payload
                    properties:
                      type:
                        type: string
                        enum:
                        - shift.open
                        - cash_movement
                        - kitchen.send
                        - order
                        - order.void
                        - order.refund
                        - shift.close
                      id: *id002
                      payload:
                        type: object
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        batch_id: *id002
                        accepted:
                          type: integer
                        duplicate:
                          type: integer
                        rejected:
                          type: integer
                        clock_offset_seconds:
                          type: integer
                          nullable: true
                        sync_version:
                          type: integer
                        results:
                          type: array
                          items:
                            $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /sync/pull:
    get:
      tags:
      - Sinkronisasi
      operationId: get_sync_pull
      summary: Tarik data master (snapshot penuh bila versi tertinggal)
      parameters:
