        totals:
          type: object
          nullable: true
          additionalProperties: true
        notes:
          type: array
          items:
            type: string
    ReportFilterMeta:
      type: object
      properties:
        date_from: &id019
          type: string
          format: date
        date_to: *id019
        brand_id:
          type: string
          format: uuid
          nullable: true
        outlet_id:
          type: string
          format: uuid
          nullable: true
        outlet_count:
          type: integer
    SalesSummary:
      type: object
      properties:
        order_count:
          type: integer
        gross_sales: &id020
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
          example: '43000.00'
        discount: *id020
        refund: *id020
        refund_count:
          type: integer
        refund_amount: *id020
        net_sales: *id020
        service_charge: *id020
        tax: *id020
        rounding: *id020
        total_collected: *id020
        average_ticket: *id020
        void_count:
          type: integer
        void_amount: *id020
    Dashboard:
      type: object
      properties:
        business_date: *id019
        generated_at: &id024
          type: string
          format: date-time
        outlet_count:
          type: integer
        today:
          $ref: '#/components/schemas/SalesSummary'
        same_time_last_week:
          allOf:
          - $ref: '#/components/schemas/SalesSummary'
          description: Hari yang sama minggu lalu, hanya transaksi sampai jam saat ini
        yesterday:
          allOf:
          - $ref: '#/components/schemas/SalesSummary'
          description: Kemarin satu hari penuh
        change:
          type: object
          description: Perubahan persen terhadap minggu lalu; null bila pembanding nol
          properties:
            net_sales: &id021
              type: string
              nullable: true
              example: '31.25'
            order_count: *id021
            average_ticket: *id021
        hourly:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
              label:
                type: string
                example: '08.00'
              net_sales: *id020
              last_week: *id020
              orders:
                type: integer
        top_items:
          type: array
          maxItems: 5
          items: &id022
            type: object
            additionalProperties: true
            properties:
              key:
                type: string
              label:
                type: string
              net_sales: *id020
              share: *id021
        outlets:
          type: array
          items: *id022
        brands:
          type: array
          items: *id022
        payments:
          type: array
          items: *id022
    FraudEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - void_before
          - void_after
          - refund
          - discount
          - cash_variance
          - drawer_open
        type_label:
          type: string
        at:
          type: string
          nullable: true
        outlet:
          type: string
        reference:
          type: string
          nullable: true
          description: Nomor struk
        amount:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
          example: '43000.00'
          nullable: true
        reason:
          type: string
          nullable: true
        user:
          type: string
        authorized_by:
          type: string
          nullable: true
        order_id:
          type: string
          format: uuid
          nullable: true
    ReportSchedule:
      type: object
      properties:
        id: &id023
          type: string
          format: uuid
        name:
          type: string
        report_key:
          $ref: '#/components/schemas/ReportKey'
        report_label:
          type: string
        format:
          type: string
          enum:
          - xlsx
          - pdf
        frequency:
          type: string
          enum:
          - daily
          - weekly
          - monthly
        send_time:
          type: string
          example: 07:00
          description: Jam lokal company
        brand_id:
          type: string
          format: uuid
          nullable: true
        outlet_id:
          type: string
          format: uuid
          nullable: true
        recipients:
          type: array
          items:
            type: string
            format: email
        is_active:
          type: boolean
        owner:
          type: object
          nullable: true
          properties:
            id: *id023
            name:
              type: string
        next_run_at:
          type: string
          format: date-time
          nullable: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: string
          nullable: true
          enum:
          - sent
          - failed
          - skipped
          - null
        disabled_reason:
          type: string
          nullable: true
        deliveries:
          type: array
          description: Hanya pada GET detail (20 terakhir)
          items:
            type: object
            properties:
              id: *id023
              period_from: *id019
              period_to: *id019
              status:
                type: string
                enum:
                - sent
                - failed
                - skipped
              recipients:
                type: array
                items:
                  type: string
              filename:
                type: string
                nullable: true
              row_count:
                type: integer
                nullable: true
              error:
                type: string
                nullable: true
              created_at: *id024
    ReportScheduleInput:
      type: object
      required:
      - name
      - report_key
      - format
      - frequency
      - recipients
      description: Laporan dibangun dengan hak akses pembuat saat dikirim. Harian = kemarin; mingguan (Senin) = Senin–Minggu
        lalu; bulanan (tanggal 1) = bulan lalu. Pada PATCH semua field opsional.
      properties:
        name:
          type: string
          maxLength: 100
        report_key:
          $ref: '#/components/schemas/ReportKey'
        format:
          type: string
          enum:
          - xlsx
          - pdf
        frequency:
          type: string
          enum:
          - daily
          - weekly
          - monthly
        send_time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          default: 07:00
        brand_id:
          type: string
          format: uuid
          nullable: true
        outlet_id:
          type: string
          format: uuid
          nullable: true
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: email
            maxLength: 150
        is_active:
          type: boolean
  responses:
    Ok:
      description: Berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Dibuat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: Gagal (400 COMPANY_REQUIRED, 401 UNAUTHENTICATED/SESSION_REVOKED, 402 plan/SUBSCRIPTION_READ_ONLY, 403
        FORBIDDEN/WRONG_CLIENT/NOT_A_MEMBER/DEVICE_REVOKED, 404 NOT_FOUND, 409, 422 VALIDATION_ERROR, 423 terkunci, 429 TOO_MANY_REQUESTS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login back-office dengan email atau nomor HP (FR-AUTH-01, FR-AUTH-08)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              - device_name
              properties:
                login:
                  type: string
                  example: rina@kopinusantara.test
                password:
                  type: string
                device_name:
                  type: string
                  example: Owner App
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      operationId: post_auth_login
  /auth/register:
    post:
      tags:
      - Auth
      summary: Pendaftaran company mandiri (FR-TEN-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - company_name
              - name
              - email
              - password
              - password_confirmation
              - accept_terms
              properties:
                company_name:
                  type: string
                city:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                accept_terms:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '422':
          $ref: '#/components/responses/Error'
      operationId: post_auth_register
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Kirim tautan reset password (respons selalu sama)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: post_auth_forgot_password
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Reset password dan buka kunci akun
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - email
              - password
              - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/Error'
      operationId: post_auth_reset_password
  /auth/me:
    get:
      tags:
      - Auth
      summary: Profil user dan daftar company yang dapat diakses (FR-AUTH-04)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: get_auth_me
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Cabut token yang sedang dipakai
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: post_auth_logout
  /auth/invitations:
    get:
      tags:
      - Undangan
      summary: Undangan company yang menunggu jawaban
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: get_auth_invitations
  /auth/invitations/{id}/accept:
    post:
      tags:
      - Undangan
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/Error'
      summary: Buat/aksi /auth/invitations/{id}/accept
      operationId: post_auth_invitations_id_accept
  /auth/invitations/{id}/decline:
    post:
      tags:
      - Undangan
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/Error'
      summary: Buat/aksi /auth/invitations/{id}/decline
      operationId: post_auth_invitations_id_decline
  /platform/companies:
    get:
      tags:
      - Platform
      summary: Daftar tenant (Super Admin)
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - trial
          - active
          - suspended
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Error'
      operationId: get_platform_companies
    post:
      tags:
      - Platform
      summary: Buat tenant untuk pemilik yang sudah punya akun (FR-TEN-02)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - owner_email
              properties:
                name:
                  type: string
                city:
                  type: string
                plan_code:
                  type: string
                  enum:
                  - basic
                  - pro
                  - enterprise
                owner_email:
                  type: string
                  format: email
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Error'
      operationId: post_platform_companies
  /platform/companies/{id}/suspend:
    post:
      tags:
      - Platform
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Buat/aksi /platform/companies/{id}/suspend
      operationId: post_platform_companies_id_suspend
  /platform/companies/{id}/activate:
    post:
      tags:
      - Platform
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Buat/aksi /platform/companies/{id}/activate
      operationId: post_platform_companies_id_activate
  /platform/companies/{id}:
    delete:
      tags:
      - Platform
      summary: Hapus tenant (soft delete)
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: delete_platform_companies_id
  /company:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    get:
      tags:
      - Company
      summary: Profil company aktif (FR-TEN-03)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: get_company
    patch:
      tags:
      - Company
      summary: Ubah profil company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '402':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      operationId: patch_company
  /brands:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    get:
      tags:
      - Brand
      summary: Daftar brand sesuai cakupan user (FR-TEN-04, FR-AUTH-06)
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: is_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Error'
      operationId: get_brands
    post:
      tags:
      - Brand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      summary: Buat/aksi /brands
      operationId: post_brands
  /brands/{id}:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Brand
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Brand'
        '404':
          $ref: '#/components/responses/Error'
      summary: Lihat /brands/{id}
      operationId: get_brands_id
    patch:
      tags:
      - Brand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Ubah /brands/{id}
      operationId: patch_brands_id
    delete:
      tags:
      - Brand
      summary: Nonaktifkan brand (ditolak bila masih ada outlet aktif)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '409':
          $ref: '#/components/responses/Error'
      operationId: delete_brands_id
  /outlets:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    get:
      tags:
      - Outlet
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: brand_id
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Outlet'
        '401':
          $ref: '#/components/responses/Error'
      summary: Lihat /outlets
      operationId: get_outlets
    post:
      tags:
      - Outlet
      summary: Buat outlet beserta konfigurasi pajak/operasional (FR-TEN-05)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutletInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '402':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      operationId: post_outlets
  /outlets/{id}:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Outlet
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Outlet'
        '401':
          $ref: '#/components/responses/Error'
      summary: Lihat /outlets/{id}
      operationId: get_outlets_id
    patch:
      tags:
      - Outlet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutletInput'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Ubah /outlets/{id}
      operationId: patch_outlets_id
    delete:
      tags:
      - Outlet
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Hapus /outlets/{id}
      operationId: delete_outlets_id
  /devices:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    get:
      tags:
      - Perangkat
      summary: Status perangkat (FR-DEV-02)
      parameters:
      - name: outlet_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
      operationId: get_devices
    post:
      tags:
      - Perangkat
      summary: Daftarkan perangkat dan terbitkan kode pairing (FR-DEV-01)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - outlet_id
              - code
              - name
              - type
              properties:
                outlet_id:
                  type: string
                  format: uuid
                code:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - pos
                  - kds
                  - customer_display
                  - kiosk
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '402':
          $ref: '#/components/responses/Error'
      operationId: post_devices
  /devices/{id}:
    parameters:
    - $ref: '#/components/parameters/CompanyHeader'
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Perangkat
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
      summary: Lihat /devices/{id}
      operationId: get_devices_id
    patch:
      tags:
      - Perangkat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      summary: Ubah /devices/{id}
      operationId: patch_devices_id
  /devices/{id}/pairing-code:
    post:
      tags:
      - Perangkat
      summary: Terbitkan kode pairing baru (kode lama dibatalkan)
      parameters:
      - $ref: '#/components/parameters/CompanyHeader'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: post_devices_id_pairing_code
  /devices/{id}/revoke:
    post:
      tags:
      - Perangkat
      summary: Nonaktifkan perangkat dari jarak jauh (FR-DEV-07)
      parameters:
      - $ref: '#/components/parameters/CompanyHeader'
      - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'
      operationId: post_devices_id_revoke
  /devices/pair:
    post:
      tags:
      - Perangkat
      summary: Dipanggil aplikasi POS/KDS untuk pairing
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  example: ABCD-EFGH
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - windows
                app_version:
                  type: string
