openapi: 3.0.3
info:
  title: FnB Cloud API
  version: 1.4.0-tahap5
  description: 'API Tahap 1–5: tenancy, autentikasi, role & akses, perangkat, audit log, katalog menu, simulasi harga, transaksi
    POS, sinkronisasi offline, pembayaran, inventory & resep, pembelian, serta laporan & dashboard.


    Semua respons memakai format standar SRS §7.4 (`success`, `data`, `meta`, `errors`).


    Jenis token (Laravel Sanctum):

    - **backoffice** — dari `POST /auth/login` / `POST /auth/register`. Endpoint tenant wajib header `X-Company-Id`.

    - **device** — dari `POST /devices/pair`. Terikat ke company & perangkat.

    - **pos** — dari `POST /pos/auth/pin`. Terikat ke company, perangkat, dan kasir.


    Angka uang dikirim sebagai **string desimal** (mis. `"18000.00"`), bukan float. Urutan perhitungan harga mengikuti SRS
    §8.1 dan ADR 0003.


    Transaksi POS (ADR 0004):


    - Perangkat membuat ID (UUID v7) dan nomor struk `{KODE_OUTLET}-{KODE_PERANGKAT}-{YYMMDD}-{URUT}`, menyimpan lokal, lalu
    mengirim lewat `POST /sync/push`. Kirim antrian **sebelum** `GET /sync/pull`: perbedaan harga/pajak/promo hanya dianggap
    sah bila data master berubah setelah tarik data terakhir perangkat.

    - Kewenangan pelaku (void, refund, diskon, ubah harga, buka laci) hanya diakui bila pelaku itu login PIN pada permintaan
    (token pos). Selain itu sertakan otorisasi supervisor: `{"mode":"online","authorization_id":...}` dari `POST /pos/authorize`
    (wajib `reference_id` = ID transaksi; sekali pakai; maks. 10 menit dari waktu aksi dan 24 jam dari jam server) atau `{"mode":"offline","supervisor_id":...}`
    (ditandai `offline_authorization`).

    - Kesalahan transaksi: `errors[0]` berisi `code`, `message`, `field`, `retryable`, `details`.


    Inventory (ADR 0005):


    - Kuantitas stok & resep selalu dalam **satuan dasar** bahan (g, ml, pcs, lembar, porsi) sebagai string desimal maks.
    4 angka (`"1500.0000"`). Harga pokok per satuan dasar maks. 6 angka (`"18.500000"`); nilai rupiah 2 angka.

    - Stok dipotong otomatis dari transaksi POS sesuai resep. Pemicu per outlet (`stock_deduction_trigger`): `on_kitchen`
    (bawaan) memotong saat entitas `kitchen.send` diterima, baris yang tidak pernah dikirim ke dapur dipotong saat lunas;
    `on_payment` memotong saat lunas. **ID baris tiket dapur harus sama dengan ID baris pesanan** agar stok tidak terpotong
    dua kali.

    - Void setelah bayar mengembalikan bahan (`stock_action` = `return`, bawaan) atau tidak (`waste`). Refund mengikuti `stock_action`
    refund.

    - Kesalahan inventory: `errors[0]` berisi `code`, `message`, `field`, `details` (mis. `STOCK_INSUFFICIENT` 409 bila outlet
    melarang stok minus).


    Laporan (ADR 0006):


    - Periode memakai **hari bisnis** outlet (`date_from`/`date_to`, format `YYYY-MM-DD`, maks. 366 hari; bawaan awal bulan
    s.d. hari ini menurut zona waktu company). Brand/outlet di luar cakupan user → 404.

    - **Penjualan bersih** = total transaksi lunas − pajak − service charge − pembulatan, dikurangi porsi refund. Refund dan
    koreksi pajaknya dicatat **pada hari refund terjadi**. Transaksi yang di-void tidak dihitung.

    - Semua laporan memakai bentuk `ReportTable` yang sama untuk layar, API, Excel, dan PDF. Nilai uang/angka berupa string
    desimal; persen berupa string (`"31.25"`).

    - `GET /reports/{report}` dan ekspor dibatasi 30 permintaan/menit per user.

    '
  license:
    name: Proprietary
    url: https://example.invalid/license
servers:
- url: http://127.0.0.1:8000/api/v1
security:
- bearer: []
tags:
- name: Auth
  description: Login, registrasi, reset password
- name: Undangan
  description: Undangan bergabung ke company
- name: Platform
  description: Super Admin platform
- name: Company
  description: Profil company aktif
- name: Brand
  description: Brand (FR-TEN-04)
- name: Outlet
  description: Outlet & konfigurasi (FR-TEN-05)
- name: Perangkat
  description: Perangkat & pairing (FR-DEV)
- name: POS
  description: Endpoint aplikasi kasir
- name: Staf
  description: Anggota company, role, cakupan, PIN
- name: Role
  description: Role & permission
- name: Audit
  description: Audit log (FR-AUD)
- name: Pengaturan Menu
  description: Stasiun dapur & channel penjualan (FR-MENU-06, FR-MENU-14)
- name: Menu
  description: Kategori, menu, varian, modifier, paket, harga khusus, ketersediaan (FR-MENU-01..10, 14, 15)
- name: Promo
  description: Promo & diskon (FR-MENU-11..13, BR-18)
- name: Harga
  description: Simulasi harga (SRS §8.1, FR-POS-20)
- name: Sinkronisasi
  description: Antrian offline & tarik data master (FR-DEV-03, FR-DEV-04, NFR-OFF)
- name: Transaksi POS
  description: Shift, transaksi, void, refund dari aplikasi kasir (FR-POS-01..24)
- name: Pembayaran
  description: Tagihan QRIS/e-wallet melalui payment gateway (FR-PAY-04..06)
- name: Penjualan
  description: Transaksi, shift, tutup hari, metode bayar di back-office (FR-POS-04, FR-POS-05, FR-PAY-02, FR-PAY-10)
- name: Inventory
  description: Bahan baku, lokasi stok, resep, posisi & kartu stok, penyesuaian, waste, transfer, opname, food cost (FR-INV-01..11)
- name: Pembelian
  description: Pemasok, purchase order, dan penerimaan barang (FR-PUR, FR-INV-05)
- name: Laporan
  description: Dashboard real-time, laporan penjualan/pajak/anti-fraud/menu/laba kotor/inventory, ekspor, dan jadwal email
    (FR-RPT-01..08, FR-RPT-10)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    CompanyHeader:
      name: X-Company-Id
      in: header
      required: true
      description: ID company aktif (hanya untuk token back-office).
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        field:
          type: string
          nullable: true
        message:
          type: string
    Envelope:
      type: object
      required:
      - success
      - data
      - meta
      - errors
      properties:
        success:
          type: boolean
        data: {}
        meta:
          type: object
          properties:
            request_id:
              type: string
            pagination:
              type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                total:
                  type: integer
                last_page:
                  type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: KTJ
        name:
          type: string
          example: Kopi Tepi Jalan
        is_active:
          type: boolean
        outlets_count:
          type: integer
    BrandInput:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          maxLength: 20
          pattern: ^[A-Za-z0-9-]+$
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
    Outlet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        code:
          type: string
          example: KMG
        name:
          type: string
        city:
          type: string
        timezone:
          type: string
          example: Asia/Jakarta
        business_day_cutoff:
          type: string
          example: 04:00
        tax:
          type: object
          properties:
            name:
              type: string
              example: PB1
            rate:
              type: string
              example: '10.00'
            inclusive:
              type: boolean
            on_service_charge:
              type: boolean
        service_charge_rate:
          type: string
          example: '5.00'
        rounding:
          type: object
          properties:
            unit:
              type: integer
              enum:
              - 0
              - 50
              - 100
              - 500
              - 1000
            mode:
              type: string
              enum:
              - nearest
              - up
              - down
        order_mode:
          type: string
          enum:
          - quick_service
          - dine_in
        stock_deduction_trigger:
          type: string
          enum:
          - on_payment
          - on_kitchen
        allow_negative_stock:
          type: boolean
        is_active:
          type: boolean
    OutletInput:
      type: object
      required:
      - brand_id
      - code
      - name
      properties:
        brand_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 10
        name:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
          pattern: ^\d{5}$
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
          enum:
          - Asia/Jakarta
          - Asia/Makassar
          - Asia/Jayapura
        opening_hours:
          type: object
          additionalProperties:
            type: object
            properties:
              open:
                type: string
                example: 07:00
              close:
                type: string
                example: '22:00'
        business_day_cutoff:
          type: string
          example: 04:00
        tax_name:
          type: string
        tax_rate:
          type: string
          example: '10'
        tax_inclusive:
          type: boolean
        tax_on_service_charge:
          type: boolean
        service_charge_rate:
          type: string
        rounding_unit:
          type: integer
          enum:
          - 0
          - 50
          - 100
          - 500
          - 1000
        rounding_mode:
          type: string
          enum:
          - nearest
          - up
          - down
        order_mode:
          type: string
          enum:
          - quick_service
          - dine_in
        stock_deduction_trigger:
          type: string
          enum:
          - on_payment
          - on_kitchen
        allow_negative_stock:
          type: boolean
        npwpd:
          type: string
        receipt_settings:
          type: object
          properties:
            header:
              type: string
            footer:
              type: string
            show_logo:
              type: boolean
            paper_width:
              type: integer
              enum:
              - 58
              - 80
        is_active:
          type: boolean
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        outlet_id:
          type: string
          format: uuid
        code:
          type: string
          example: POS01
        name:
          type: string
        type:
          type: string
          enum:
          - pos
          - kds
          - customer_display
          - kiosk
        status:
          type: string
          enum:
          - pending
          - active
          - revoked
        is_online:
          type: boolean
        app_version:
          type: string
          nullable: true
        pending_sync_count:
          type: integer
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        employee_code:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        scopes:
          type: object
          properties:
            brands:
              type: array
              items:
                type: string
                format: uuid
            outlets:
              type: array
              items:
                type: string
                format: uuid
        has_pin:
          type: boolean
        pin_locked:
          type: boolean
        is_active:
          type: boolean
    StaffInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          description: Hanya saat membuat. Akun yang sudah ada akan diundang.
        phone:
          type: string
          example: 0812 3456 7890
        employee_code:
          type: string
        roles:
          type: array
          items:
            type: string
        scopes:
          type: object
          properties:
            brands:
              type: array
              items:
                type: string
                format: uuid
            outlets:
              type: array
              items:
                type: string
                format: uuid
        pin:
          type: string
          pattern: ^\d{4,6}$
        is_active:
          type: boolean
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: kasir_senior
        label:
          type: string
        is_system:
          type: boolean
        max_discount_percent:
          type: string
          example: '10.00'
        permissions:
          type: array
          items:
            type: string
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        legal_name:
          type: string
          nullable: true
        npwp:
          type: string
          nullable: true
        timezone:
          type: string
        currency:
          type: string
          example: IDR
        status:
          type: string
          enum:
          - trial
          - active
          - suspended
        read_only:
          type: boolean
        subscription:
          type: object
          properties:
            plan:
              type: object
              nullable: true
            ends_at:
              type: string
              format: date-time
              nullable: true
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: pos.authorization_granted
        entity:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        user:
          type: object
          nullable: true
        authorized_by:
          type: object
          nullable: true
        device_id:
          type: string
          nullable: true
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        reason:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
    KitchenStation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: BAR
        name:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
    KitchenStationInput:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
          maxLength: 20
        name:
          type: string
          maxLength: 60
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        is_active:
          type: boolean
    SalesChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: gofood
        name:
          type: string
        type:
          type: string
          enum:
          - in_store
          - aggregator
          - online
        service_charge_applies:
          type: boolean
        is_system:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
    SalesChannelInput:
      type: object
      description: '`code` dan `type` hanya saat membuat.'
      properties:
        code:
          type: string
          pattern: ^[a-z0-9_]+$
          maxLength: 30
        name:
          type: string
          maxLength: 60
        type:
          type: string
          enum:
          - in_store
          - aggregator
          - online
        service_charge_applies:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        is_active:
          type: boolean
    MenuCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        sort_order:
          type: integer
        is_active:
          type: boolean
        items_count:
          type: integer
          nullable: true
    MenuCategoryInput:
      type: object
      description: '`brand_id` hanya saat membuat. Nama unik per brand (tanpa membedakan huruf).'
      properties:
        brand_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        color:
          type: string
          enum:
          - gray
          - red
          - orange
          - amber
          - green
          - teal
          - sky
          - blue
          - violet
          - pink
        icon:
          type: string
          nullable: true
          pattern: ^heroicon-[om]-[a-z0-9-]+$
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        is_active:
          type: boolean
    Modifier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          example: '18000.00'
        is_default:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
    ModifierGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        name:
          type: string
        min_select:
          type: integer
        max_select:
          type: integer
        required:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
    ModifierGroupInput:
      type: object
      properties:
        brand_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        min_select:
          type: integer
          minimum: 0
        max_select:
          type: integer
          minimum: 1
        sort_order:
          type: integer
        is_active:
          type: boolean
        modifiers:
          type: array
          minItems: 1
          maxItems: 100
          description: Daftar lengkap; pilihan yang tidak dikirim dihapus. Sertakan `id` untuk mempertahankan pilihan lama.
          items:
            type: object
            required:
            - name
            - price
            properties:
              id:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              price:
                type: string
                pattern: ^\d+(\.\d{1,2})?$
                example: '18000.00'
              is_default:
                type: boolean
              is_active:
                type: boolean
    ItemVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          example: '18000.00'
        is_default:
          type: boolean
        is_active:
          type: boolean
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        category:
          type: object
          nullable: true
        type:
          type: string
          enum:
          - single
          - bundle
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        name:
          type: string
        short_name:
          type: string
        base_price:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          example: '18000.00'
        kitchen_station_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        sort_order:
          type: integer
        updated_at:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          description: Hanya di detail
        channel_codes:
          type: array
          nullable: true
          items:
            type: string
        schedule:
          type: array
          items:
            type: object
            required:
            - start
            - end
            properties:
              days:
                type: array
                nullable: true
                items:
                  type: integer
                  minimum: 1
                  maximum: 7
                description: 1 = Senin … 7 = Minggu; null = setiap hari
              start:
                type: string
                example: 06:00
              end:
                type: string
                example: '10:00'
                description: Boleh lebih kecil dari start (melewati tengah malam)
          nullable: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ItemVariant'
        modifier_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        bundle_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              min_select:
                type: integer
              max_select:
                type: integer
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    item_id:
                      type: string
                      format: uuid
                    item_variant_id:
                      type: string
                      format: uuid
                      nullable: true
                    extra_price:
                      type: string
                      pattern: ^\d+(\.\d{1,2})?$
                      example: '18000.00'
                    is_default:
                      type: boolean
    ItemInput:
      type: object
      description: '`brand_id` dan `type` hanya saat membuat. `variants`, `modifier_group_ids`, `bundle_groups` bila dikirim
        menggantikan seluruh isi. Semua referensi harus dari brand yang sama.'
      properties:
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - single
          - bundle
        sku:
          type: string
          pattern: ^[A-Za-z0-9\-_.]+$
          maxLength: 40
        barcode:
          type: string
          nullable: true
        name:
          type: string
          maxLength: 100
        short_name:
          type: string
          maxLength: 24
          nullable: true
        description:
          type: string
          nullable: true
        base_price:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          example: '18000.00'
        kitchen_station_id:
          type: string
          format: uuid
          nullable: true
        channel_codes:
          type: array
          nullable: true
          items:
            type: string
          description: null = semua channel
        schedule:
          type: array
          items:
